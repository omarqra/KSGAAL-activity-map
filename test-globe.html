      variant: 'green', icon: 'globe', bar: Math.min(cc * 1.5, 100)
    },
    {
      label: 'المنظمات الدولية', value: oc,
      unit: 'منظمة', badge: `${(cc + oc) > 0 ? Math.round(oc/(cc+oc)*100) : 0}% من الجهات`,
      variant: 'purple', icon: 'building', bar: Math.min(oc * 8, 100)
    },
    {
      label: 'الفعاليات والمؤتمرات', value: events,
      unit: 'فعالية', badge: `${pct(events)}% من الإجمالي`,
      variant: 'orange', icon: 'star', bar: pct(events)
    }
  ];

  /* LEFT column — 4 cards */
  const leftCards = [
    {
      label: 'التعليم والتدريب', value: training,
      unit: 'برنامج', badge: `${pct(training)}% من الإجمالي`,
      variant: 'cyan', icon: 'cap', bar: pct(training)
    },
    {
      label: 'الشراكات والاتفاقيات', value: partners,
      unit: 'اتفاقية', badge: `${pct(partners)}% من الإجمالي`,
      variant: 'pink', icon: 'hands', bar: pct(partners)
    },
    {
      label: 'البحوث العلمية والكتب', value: research,
      unit: 'بحث وكتاب', badge: `${pct(research)}% من الإجمالي`,
      variant: 'gold', icon: 'book', bar: pct(research)
    },
    {
      label: 'التغطية الإقليمية', value: regionsCovered,
      unit: 'منطقة جغرافية', badge: '4 قارات مستهدفة',
      variant: 'teal', icon: 'map', bar: (regionsCovered / 4) * 100
    }
  ];

  function cardHTML(c, i) {
    const pctVal = Math.round(c.bar);
    return `
      <div class="stat-card v-${c.variant}" style="--d:${i * 0.08}s"
           data-n="${c.value}" data-bar="${pctVal}">
        <div class="sc-top">
          <span class="sc-label">${c.label}</span>
          <div class="sc-ring">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle class="sc-ring-bg" cx="20" cy="20" r="15.915"/>
              <circle class="sc-ring-fg" cx="20" cy="20" r="15.915" data-w="${pctVal}"/>
            </svg>
            <span class="sc-icon">${SC_ICONS[c.icon] || ''}</span>
          </div>
        </div>
        <div class="sc-num-row">
          <span class="sc-value" data-target="${c.value}">0</span>
          <span class="sc-unit">${c.unit}</span>
        </div>
        <div class="sc-foot">
          <span class="sc-badge"><span class="badge-arrow">↑</span>${c.badge}</span>
          <span class="sc-pct">${pctVal}%</span>
        </div>
      </div>`;
  }

  document.getElementById('statsRight').innerHTML = rightCards.map(cardHTML).join('');
  document.getElementById('statsLeft').innerHTML  = leftCards.map(cardHTML).join('');

  _sd = { total, cc, oc };
}

function animateStats() {
  if (!_sd) return;
  document.querySelectorAll('.stat-card').forEach((card, i) => {
    const valEl = card.querySelector('.sc-value');
    const ring  = card.querySelector('.sc-ring-fg');
    if (!valEl) return;

    const n = parseFloat(valEl.dataset.target) || 0;
    const w = ring ? (parseFloat(ring.dataset.w) || 0) : 0;

    valEl.textContent = '0';
    if (ring) {
      ring.style.transition = 'none';
      ring.style.strokeDashoffset = '100';
      void ring.getBoundingClientRect();
    }

    const baseDelay = 260 + i * 75;

    /* slide-in */
    setTimeout(() => card.classList.add('ready'), 20 + i * 45);

    /* count-up */
    setTimeout(() => {
      const t0 = performance.now(), dur = 1400;
      const loop = now => {
        const p = Math.min((now - t0) / dur, 1);
        const ease = 1 - Math.pow(1 - p, 4);
        valEl.textContent = Math.round(ease * n).toLocaleString('ar-EG');
        if (p < 1) requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }, baseDelay);

    /* ring sweep — circumference is normalized to 100 (r ≈ 15.915) */
    if (ring) {
      setTimeout(() => {
        ring.style.transition = '';
        ring.style.strokeDashoffset = String(Math.max(0, 100 - w));
      }, baseDelay + 100);
    }
  });
}

/* ============================================================
   ACTIVITIES PANEL — filters + list rendering
   (ported from index.html; `#globeUI` swapped for `document.body`
    so the same CSS class transitions fire in this page.)
============================================================ */
function initActivitiesPanel(data) {
  const TYPE_META = (data.activityTypes && typeof data.activityTypes === 'object') ? data.activityTypes : {};

  function yearOf(date) {
    if (!date || typeof date !== 'string') return null;
    const m = date.match(/(19|20)\d{2}/);
    return m ? parseInt(m[0], 10) : null;
  }
  /* Reuse the per-activity index built up-front in map.on('load'). It
     already carries id + entity + lat/lng, so the panel just needs to
     decorate each item with `year`. */
  const flat = (data._activities || []).map(a => ({
    id: a.id,
    name: a.name, type: a.type, subtype: a.subtype,
    date: a.date, year: yearOf(a.date),
    lat: a.lat, lng: a.lng,
    entity: a.entity
  }));

  const state = {
    q: '', type: 'all', subtype: 'all',
    location: 'all', year: 'all', group: 'none',
    /* Tracks the *single activity* currently focused — pin and card
       clicks toggle on this id together. Persisted so the highlight
       survives filter changes / panel reopens. */
    highlightedActivityId: null
  };

  const typesInData = [...new Set(flat.map(x => x.type).filter(Boolean))];
  const FALLBACK_PALETTE = ['#4facfe','#4ade80','#b388ff','#ff9a44','#ff5c8d','#ffd700','#00dbde','#5ba4a4'];
  const fallbackColorMap = {};
  typesInData.forEach((t, i) => { fallbackColorMap[t] = FALLBACK_PALETTE[i % FALLBACK_PALETTE.length]; });
  const typeColor = t => (TYPE_META[t] && TYPE_META[t].color) || fallbackColorMap[t] || '#4facfe';
  const typeLabel = t => (TYPE_META[t] && TYPE_META[t].label) || (t || '').replace(/_/g, ' ');

  const locations = [
    ...data.countries.map(c => ({ code: c.code, label: c.short || c.name, kind: 'country' })),
    ...data.organizations.map(o => ({ code: o.code, label: o.short || o.name, kind: 'org' }))
  ];

  const ICON = {
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    tag:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>'
  };

  const typeChipsEl    = document.getElementById('actTypeChips');
  const subtypeSection = document.getElementById('subtypeSection');
  const subtypeChipsEl = document.getElementById('actSubtypeChips');
  const locSel         = document.getElementById('actLocationFilter');
  const yearSel        = document.getElementById('actYearFilter');
  const groupEl        = document.getElementById('actGroupBy');
  const listEl         = document.getElementById('actList');
  const countEl        = document.getElementById('actResultsCount');
  const searchEl       = document.getElementById('actSearch');

  /* Match an item against the active filters, optionally skipping
     a subset of fields. Used to compute "what would be available
     if the user changed only this one filter?" — so the dropdowns
     never offer a value that would yield zero results. */
  function matchesExcept(a, exclude) {
    const q = state.q.trim().toLowerCase();
    if (!exclude.has('type') && state.type !== 'all' && a.type !== state.type) return false;
    if (!exclude.has('subtype') && state.subtype !== 'all' && a.subtype !== state.subtype) return false;
    if (!exclude.has('location') && state.location !== 'all') {
      const [kind, code] = state.location.split(':');
      const wantKind = kind === 'c' ? 'country' : 'org';
      if (a.entity.kind !== wantKind || a.entity.code !== code) return false;
    }
    if (!exclude.has('year') && state.year !== 'all') {
      if (state.year === 'none') { if (a.year) return false; }
      else if (a.year !== parseInt(state.year, 10)) return false;
    }
    if (!exclude.has('q') && q && !(a.name || '').toLowerCase().includes(q)) return false;
    return true;
  }

  function applyFilters() {
    return flat.filter(a => matchesExcept(a, new Set()));
  }

  function availableTypeCounts() {
    const scoped = flat.filter(a => matchesExcept(a, new Set(['type', 'subtype'])));
    const counts = {};
    scoped.forEach(x => { counts[x.type] = (counts[x.type]||0)+1; });
    return { counts, total: scoped.length };
  }

  function availableSubtypeCounts() {
    const scoped = flat.filter(a => matchesExcept(a, new Set(['subtype'])));
    const counts = {};
    scoped.forEach(x => { if (x.subtype) counts[x.subtype] = (counts[x.subtype]||0)+1; });
    return { counts, total: Object.values(counts).reduce((s,n)=>s+n,0) };
  }

  function availableLocationCodes() {
    const scoped = flat.filter(a => matchesExcept(a, new Set(['location'])));
    const set = new Set();
    scoped.forEach(a => set.add(`${a.entity.kind === 'country' ? 'c' : 'o'}:${a.entity.code}`));
    return set;
  }

  function availableYearSet() {
    const scoped = flat.filter(a => matchesExcept(a, new Set(['year'])));
    const ys = new Set();
    let hasUndefined = false;
    scoped.forEach(a => { if (a.year) ys.add(a.year); else hasUndefined = true; });
    return { years: [...ys].sort((a,b) => b - a), hasUndefined };
  }

  function renderTypeChips() {
    const { counts, total } = availableTypeCounts();

    /* If the active type no longer has any matching items, fall back to "all". */
    if (state.type !== 'all' && !counts[state.type]) {
      state.type = 'all';
      state.subtype = 'all';
    }

    const chips = [
      `<button type="button" class="ap-chip ${state.type==='all'?'active':''}" data-v="all"
         style="--chipActive:rgba(79,172,254,.18);--chipBorder:rgba(79,172,254,.55);--chipColor:#4facfe">
         جميع الأنشطة<span class="count">${total}</span>
       </button>`
    ];
    typesInData.forEach(t => {
      const n = counts[t] || 0;
      if (n === 0 && state.type !== t) return;          /* drop empty types */
      const color = typeColor(t);
      const active = state.type === t ? 'active' : '';
      chips.push(`<button type="button" class="ap-chip ${active}" data-v="${t}"
        style="--chipActive:${color}28;--chipBorder:${color}aa;--chipColor:${color}">
        <span class="swatch" style="--sw:${color}"></span>
        ${typeLabel(t)}<span class="count">${n}</span>
      </button>`);
    });
    typeChipsEl.innerHTML = chips.join('');
  }

  function renderSubtypeChips() {
    const { counts, total } = availableSubtypeCounts();
    const subs = Object.keys(counts);

    if (subs.length === 0) {
      subtypeSection.style.display = 'none';
      state.subtype = 'all';
      return;
    }

    /* Drop a stale subtype selection that no longer matches. */
    if (state.subtype !== 'all' && !counts[state.subtype]) {
      state.subtype = 'all';
    }

    subtypeSection.style.display = 'block';
    const color = state.type !== 'all' ? typeColor(state.type) : '#4facfe';

    const chips = [
      `<button type="button" class="ap-chip ${state.subtype==='all'?'active':''}" data-v="all"
         style="--chipActive:${color}22;--chipBorder:${color}88;--chipColor:${color}">
         الكل<span class="count">${total}</span>
       </button>`,
      ...subs.map(s => `<button type="button" class="ap-chip ${state.subtype===s?'active':''}" data-v="${s}"
          style="--chipActive:${color}22;--chipBorder:${color}88;--chipColor:${color}">
          ${s}<span class="count">${counts[s]}</span>
        </button>`)
    ];
    subtypeChipsEl.innerHTML = chips.join('');
  }

  function refreshSelects() {
    /* ── Location dropdown: only entities that have matching activities. ── */
    const availLoc = availableLocationCodes();
    const countryOpts = locations.filter(l => l.kind === 'country' && availLoc.has(`c:${l.code}`));
    const orgOpts     = locations.filter(l => l.kind === 'org'     && availLoc.has(`o:${l.code}`));

    let locHTML = '<option value="all">جميع الجهات</option>';
    if (countryOpts.length) {
      locHTML += '<optgroup label="الدول">'
        + countryOpts.map(l => `<option value="c:${l.code}">${l.label}</option>`).join('')
        + '</optgroup>';
    }
    if (orgOpts.length) {
      locHTML += '<optgroup label="المنظمات">'
        + orgOpts.map(l => `<option value="o:${l.code}">${l.label}</option>`).join('')
        + '</optgroup>';
    }
    locSel.innerHTML = locHTML;

    /* If the previously selected entity is no longer available, reset. */
    if (state.location !== 'all' && !availLoc.has(state.location)) {
      state.location = 'all';
    }
    locSel.value = state.location;

    /* ── Year dropdown: only years (and "غير محدد") that have matching activities. ── */
    const { years: availYears, hasUndefined } = availableYearSet();
    let yearHTML = '<option value="all">جميع السنوات</option>'
      + availYears.map(y => `<option value="${y}">${y}</option>`).join('');
    if (hasUndefined) yearHTML += '<option value="none">غير محدد</option>';
    yearSel.innerHTML = yearHTML;

    if (state.year !== 'all') {
      const stillValid = (state.year === 'none' && hasUndefined)
        || availYears.includes(parseInt(state.year, 10));
      if (!stillValid) state.year = 'all';
    }
    yearSel.value = state.year;
  }

  function flagUrlLocal(code) {
    return `https://flagcdn.com/w40/${(code||'').toLowerCase()}.png`;
  }

  function cardHTML(a, idx) {
    const color = typeColor(a.type);
    const delay = Math.min(idx * 0.02, 0.4);
    const dateTxt = a.date || 'بدون تاريخ';
    const entityFlag = a.entity.kind === 'country'
      ? `<img class="flag" src="${flagUrlLocal(a.entity.code)}" alt="" onerror="this.style.display='none'">`
      : `<span class="entity-dot" style="color:${color}"></span>`;

    const subtypeMeta = a.subtype
      ? `<span class="ap-meta subtype">${ICON.tag}<span>${a.subtype}</span></span>`
      : '';

    /* Per-activity id drives the toggle; same picture whether the
       activation came from this card or its pin on the globe. */
    const activeCls = state.highlightedActivityId === a.id
      ? ' entity-active is-launching' : '';
    return `
      <article class="ap-card${activeCls}" role="button" tabindex="0"
               data-activity-id="${a.id}"
               aria-label="فتح ${a.name}"
               style="--accent:${color}; animation-delay:${delay}s">
        <div class="ap-card-head">
          <span class="ap-type-tag">
            <span class="dot"></span>
            <span>${typeLabel(a.type)}</span>
          </span>
          <span class="ap-entity-tag" title="${a.entity.short}">
            ${entityFlag}<span>${a.entity.short}</span>
          </span>
        </div>
        <div class="ap-card-title">${a.name}</div>
        <div class="ap-card-foot">
          <span class="ap-meta">${ICON.calendar}<span>${dateTxt}</span></span>
          ${subtypeMeta}
        </div>
      </article>`;
  }

  function groupBy(items, key) {
    const map = new Map();
    items.forEach(x => {
      let k;
      if (key === 'year')        k = x.year || 'بدون تاريخ';
      else if (key === 'entity') k = x.entity.short;
      else if (key === 'type')   k = typeLabel(x.type);
      map.has(k) ? map.get(k).push(x) : map.set(k, [x]);
    });
    return map;
  }

  function isFilterActive() {
    return state.q.trim() !== '' || state.type !== 'all' || state.subtype !== 'all'
        || state.location !== 'all' || state.year !== 'all';
  }

  function syncPinsToFilters(items) {
    if (typeof window.setActivityFilter !== 'function') return;
    if (!isFilterActive()) { window.setActivityFilter(null); return; }
    /* Per-activity pins → filter by activity id, not entity code. */
    const ids = new Set(items.map(a => a.id));
    window.setActivityFilter(ids);
  }

  function render() {
    const items = applyFilters();
    countEl.innerHTML = `<b>${items.length}</b>نشاط مطابق`;
    syncPinsToFilters(items);

    if (!items.length) {
      listEl.innerHTML = `
        <div class="ap-empty">
          <div class="ap-empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="ap-empty-t">لا توجد نتائج</div>
          <div class="ap-empty-s">جرب تعديل الفلاتر أو البحث بكلمات أخرى</div>
        </div>`;
      return;
    }

    if (state.group === 'none') {
      listEl.innerHTML = items.map((a,i) => cardHTML(a,i)).join('');
    } else {
      const groups = groupBy(items, state.group);
      const sorted = [...groups.entries()];
      if (state.group === 'year') sorted.sort((a,b) => (b[0]==='بدون تاريخ' ? -1 : a[0]==='بدون تاريخ' ? 1 : b[0]-a[0]));
      else sorted.sort((a,b) => b[1].length - a[1].length);

      listEl.innerHTML = sorted.map(([k, arr]) => `
        <div class="ap-group-title">
          <span>${k}</span>
          <span class="badge">${arr.length}</span>
        </div>
        ${arr.map((a,i) => cardHTML(a,i)).join('')}
      `).join('');
    }
  }

  /* Re-render every dependent UI piece after a filter change so that
     chip counts, dropdown options, and the result list all stay in sync
     with each other (no "phantom" options that produce zero results). */
  function rerenderAll() {
    renderTypeChips();
    renderSubtypeChips();
    refreshSelects();
    render();
  }

  typeChipsEl.addEventListener('click', e => {
    const btn = e.target.closest('.ap-chip'); if (!btn) return;
    state.type = btn.dataset.v;
    state.subtype = 'all';
    rerenderAll();
  });
  subtypeChipsEl.addEventListener('click', e => {
    const btn = e.target.closest('.ap-chip'); if (!btn) return;
    state.subtype = btn.dataset.v;
    rerenderAll();
  });
  searchEl.addEventListener('input', e => { state.q = e.target.value; rerenderAll(); });
  locSel.addEventListener('change', e => { state.location = e.target.value; rerenderAll(); });
  yearSel.addEventListener('change', e => { state.year = e.target.value; rerenderAll(); });

  groupEl.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    state.group = btn.dataset.v;
    groupEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  /* ── Unified entry point: pin-click and card-click both end up here.
     Toggle is keyed on the activity id (state.highlightedActivityId), so
     re-clicking the same pin OR its card flies home, and the highlight
     stays on exactly one card at a time — perfectly 1:1 with one pin. ── */
  function activateActivity(act) {
    if (!act || !act.id) return;
    if (typeof act.lat !== 'number' || typeof act.lng !== 'number') return;

    /* Already active → toggle off (fly home, clear highlight). flyHome
       calls activitiesPanelClearHighlight which resets state + strips
       the two classes from any cards. */
    if (state.highlightedActivityId === act.id) {
      try {
        if (typeof window.globeFlyHome === 'function') window.globeFlyHome();
      } catch (e) {}
      return;
    }

    state.highlightedActivityId = act.id;

    /* If the panel is closed (typical pin-click-from-globe case), open
       it so the user sees the matching card alongside the zoom. openPanel
       re-renders the list — cardHTML applies the highlight classes from
       state.highlightedActivityId, and openPanel itself queues the
       scroll-into-view. When the panel is already open we just toggle
       DOM classes in place to avoid a wasted full re-render. */
    if (!document.body.classList.contains('viewing-activities')) {
      openPanel();
    } else {
      let firstMatch = null;
      listEl.querySelectorAll('.ap-card').forEach(c => {
        const isMatch = c.dataset.activityId === act.id;
        c.classList.toggle('entity-active', isMatch);
        c.classList.toggle('is-launching', isMatch);
        if (isMatch && !firstMatch) firstMatch = c;
      });
      if (firstMatch) firstMatch.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    try {
      if (typeof window.globeFlyToActivity === 'function') {
        window.globeFlyToActivity(act);
      }
    } catch (e) {}
  }
  /* Exposed so the pin click handler in the main script section
     can route through the same code path. */
  window.activateActivity = activateActivity;

  function activateFromCard(card) {
    const id = card.dataset.activityId;
    if (!id) return;
    const act = flat.find(a => a.id === id);
    if (act) activateActivity(act);
  }

  listEl.addEventListener('click', e => {
    const card = e.target.closest('.ap-card'); if (!card) return;
    activateFromCard(card);
  });
  listEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.ap-card'); if (!card) return;
    e.preventDefault(); activateFromCard(card);
  });

  document.getElementById('actResetBtn').addEventListener('click', () => {
    state.q = ''; state.type = 'all'; state.subtype = 'all';
    state.location = 'all'; state.year = 'all'; state.group = 'none';
    state.highlightedActivityId = null;
    searchEl.value = '';
    groupEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === 'none'));
    rerenderAll();
  });

  /* ── Open / close transitions (drives CSS via body.viewing-activities) ── */
  const openBtn  = document.getElementById('activitiesToggleBtn');
  const closeBtn = document.getElementById('activitiesCloseBtn');
  const panelEl  = document.getElementById('activitiesPanel');

  /* Drive map.resize() across the CSS transition so the WebGL canvas
     follows the shrinking/growing #map div smoothly instead of popping
     at the end. ~900ms matches the CSS transition above. */
  let _panelResizeRaf = null;
  function smoothResizeMap() {
    if (_panelResizeRaf) cancelAnimationFrame(_panelResizeRaf);
    const dur = 900;
    const start = performance.now();
    const loop = () => {
      try { map.resize(); } catch(e) {}
      if (performance.now() - start < dur) {
        _panelResizeRaf = requestAnimationFrame(loop);
      }
    };
    _panelResizeRaf = requestAnimationFrame(loop);
  }

  function openPanel() {
    document.body.classList.add('viewing-activities');
    panelEl.setAttribute('aria-hidden', 'false');
    try { if (typeof window.setGlobeAutoRotate === 'function') window.setGlobeAutoRotate(false); } catch(e) {}
    render();
    smoothResizeMap();
    /* If a pin was clicked while the panel was closed, the highlight was
       set silently. Now that the panel is sliding in, scroll to the
       active card so the user sees the connection. */
    if (state.highlightedActivityId) {
      setTimeout(() => {
        const firstMatch = listEl.querySelector('.ap-card.is-launching');
        if (firstMatch) firstMatch.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 350);
    }
  }

  /* Called by flyHome (top "back" button) and the reset button so the
     panel highlight stays in sync with the globe overview state. */
  window.activitiesPanelClearHighlight = function() {
    state.highlightedActivityId = null;
    listEl.querySelectorAll('.entity-active').forEach(c => c.classList.remove('entity-active'));
    listEl.querySelectorAll('.is-launching').forEach(c => c.classList.remove('is-launching'));
  };
  function closePanel() {
    document.body.classList.remove('viewing-activities');
    panelEl.setAttribute('aria-hidden', 'true');
    listEl.querySelectorAll('.is-launching').forEach(c => c.classList.remove('is-launching'));
    try { if (typeof window.setGlobeAutoRotate === 'function') window.setGlobeAutoRotate(true); } catch(e) {}
    if (typeof window.setActivityFilter === 'function') window.setActivityFilter(null);
    smoothResizeMap();
  }

  /* Keep the panel highlight in sync with the in-globe back button:
     if the user clicks the top-center "← العودة للكرة الأرضية" while
     the panel is open, drop the active-card glow too. */
  const _topBackBtn = document.getElementById('backBtn');
  if (_topBackBtn) {
    _topBackBtn.addEventListener('click', () => {
      listEl.querySelectorAll('.is-launching').forEach(c => c.classList.remove('is-launching'));
    });
  }

  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('viewing-activities')) closePanel();
  });

  /* Initial render */
  rerenderAll();
}

map.on('error', (ev) => {
  console.error('Map error:', ev);
});
</script>
</body>
</html>
