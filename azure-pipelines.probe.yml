# TEMPORARY probe pipeline — reports facts, deploys nothing. Delete after use.
#
# Round 4: can the CLUSTER pull from a public registry, or only from the
# academy's own OCIR?
#
# This decides whether we can ship without waiting for OCIR credentials. The
# agent's image list hints the answer is no — every public image it holds
# also exists retagged under jed.ocir.io/axzbw7rafu2r, which is the classic
# shape of a cluster that can only pull from an internal registry. Hints are
# not evidence, so we ask the cluster directly.
#
# Two throwaway pods, one per public registry. Both are deleted at the end
# whatever happens; neither touches anything the app uses.

trigger: none
pr: none

pool:
  name: Default

steps:
  - checkout: none

  - task: Kubernetes@1
    displayName: "0. cluster login"
    inputs:
      connectionType: Kubernetes Service Connection
      kubernetesServiceEndpoint: development-AATW
      namespace: dev
      command: login

  - bash: |
      kubectl -n dev delete pod pull-test-hub pull-test-ghcr --ignore-not-found=true
    displayName: "1. clean up any earlier attempt"
    continueOnError: true

  - bash: |
      kubectl -n dev run pull-test-hub  --image=nginx:alpine --restart=Never
      kubectl -n dev run pull-test-ghcr --image=ghcr.io/headlamp-k8s/headlamp:v0.30.0 --restart=Never
    displayName: "2. start one pod per public registry"
    continueOnError: true

  # 90s is generous for a small image; a registry the cluster cannot reach
  # sits in ImagePullBackOff long before that.
  - bash: |
      kubectl -n dev wait --for=condition=Ready pod/pull-test-hub --timeout=90s
    displayName: "3. Docker Hub reachable from the cluster?"
    continueOnError: true

  - bash: |
      kubectl -n dev wait --for=condition=Ready pod/pull-test-ghcr --timeout=90s
    displayName: "4. ghcr.io reachable from the cluster?"
    continueOnError: true

  # The real answer lives here: Events at the bottom name the exact failure
  # (DNS, timeout, forbidden) rather than just "it did not start".
  - bash: |
      kubectl -n dev describe pod pull-test-hub
    displayName: "5. why Docker Hub succeeded or failed"
    continueOnError: true

  - bash: |
      kubectl -n dev describe pod pull-test-ghcr
    displayName: "6. why ghcr.io succeeded or failed"
    continueOnError: true

  - bash: |
      kubectl -n dev delete pod pull-test-hub pull-test-ghcr --ignore-not-found=true
    displayName: "7. clean up"
    condition: always()
    continueOnError: true
