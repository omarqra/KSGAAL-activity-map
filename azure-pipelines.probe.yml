# TEMPORARY probe pipeline — reports facts, deploys nothing. Delete after use.
#
# Round 1: Linux agent, Docker works, internet open, no Node.
# Round 2: service account azdevops-dev has full rights in namespace `dev`;
#          `dev` is empty and holds no imagePullSecret.
# Round 3 (this file): find the internal container registry WITHOUT asking
#          the academy. If this agent has ever built or deployed another of
#          their projects, the registry host is recorded in Docker's own
#          state — in pulled image tags, in the daemon config, or as a key
#          in the credential store.
#
# Credentials are never printed: step 4 lists only the hostnames that appear
# as keys in the Docker credential file, never the values beside them.

trigger: none
pr: none

pool:
  name: Default

steps:
  - checkout: none

  # Image tags carry their registry host, e.g. registry.ksaa.gov.sa/foo:1.
  # Anything here that is not a plain Docker Hub name is a lead.
  - script: docker images
    displayName: "1. images already on this agent"
    continueOnError: true

  # Reveals configured registry mirrors and insecure (internal) registries.
  - script: docker info
    displayName: "2. docker daemon info (mirrors, insecure registries)"
    continueOnError: true

  - script: cat /etc/docker/daemon.json
    displayName: "3. docker daemon config"
    continueOnError: true

  # Hostnames only. The values next to these keys are credentials and are
  # deliberately not printed.
  - script: |
      grep -oE '"[A-Za-z0-9._-]+(:[0-9]+)?"[[:space:]]*:' ~/.docker/config.json
    displayName: "4. registries this agent has logged into (names only)"
    continueOnError: true
