# TEMPORARY probe pipeline — reports facts, deploys nothing. Delete after use.
#
# Round 1 established: Linux agent, Docker works and can pull from Docker Hub,
# outbound internet is open, Node is NOT installed, and the service account is
# `azdevops-dev` in namespace `dev`.
#
# Round 2 (this file) tests the ONE thing still unknown: what that account is
# actually allowed to do inside `dev` — every check is namespace-scoped.
# `auth can-i` prints yes/no and exits 1 on "no", so each step is
# continueOnError; the printed word is the answer, not the step colour.

trigger: none
pr: none

pool:
  name: Default

steps:
  - checkout: none

  - task: Kubernetes@1
    displayName: "0. cluster login"
    inputs:
      connectionType: Kubernetes Service Connection
      kubernetesServiceEndpoint: development-AATW
      command: login

  - script: kubectl auth can-i --list -n dev
    displayName: "1. full permission list in dev"
    continueOnError: true

  - script: kubectl get all -n dev
    displayName: "2. what already runs in dev"
    continueOnError: true

  - script: kubectl auth can-i create deployment -n dev
    displayName: "3. create deployment?"
    continueOnError: true

  - script: kubectl auth can-i create service -n dev
    displayName: "4. create service?"
    continueOnError: true

  - script: kubectl auth can-i create ingress -n dev
    displayName: "5. create ingress?"
    continueOnError: true

  - script: kubectl auth can-i create secret -n dev
    displayName: "6. create secret?"
    continueOnError: true

  - script: kubectl auth can-i create job -n dev
    displayName: "7. create job?"
    continueOnError: true

  # An existing imagePullSecret here would tell us which registry the cluster
  # pulls from — the other open question.
  - script: kubectl get secrets -n dev
    displayName: "8. secrets in dev (imagePullSecret?)"
    continueOnError: true
