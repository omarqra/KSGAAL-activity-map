apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — namespace: ksgaal-staging
# Apply with: kubectl apply -k k8s/overlays/staging/
# Validate with: kubectl kustomize k8s/overlays/staging/

namespace: ksgaal-staging

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml

commonLabels:
  app.kubernetes.io/part-of: ksgaal-activity-map
  environment: staging
