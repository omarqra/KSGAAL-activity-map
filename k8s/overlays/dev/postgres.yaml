# PostgreSQL for the development environment, run inside the cluster.
#
# The academy confirmed on 2026-09-21 that the database is to be created from
# within the cluster rather than provisioned as a separate managed resource.
# Everything here therefore lives in the `dev` namespace, which is the only
# place our service account has rights.
#
# The image cannot come from Docker Hub — the nodes have no outbound internet.
# The pipeline mirrors it through the academy's own registry and substitutes
# the reference into POSTGRES_IMAGE_REF below.
#
# Scope: this is a development database. A single replica, no backups, no
# replication. Production should use a managed database.
#
# Deliberately NOT listed in this overlay's kustomization.yaml — the pipeline
# applies it only while `deployInClusterPostgres` is true.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ksgaal-postgres-data
  labels:
    app.kubernetes.io/name: ksgaal-postgres
    app.kubernetes.io/part-of: ksgaal-activity-map
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName is intentionally unset so the cluster's default applies.
  # We cannot list StorageClasses — they are cluster-scoped and this service
  # account has no rights there — so naming one would be a guess. If this
  # claim stays Pending, the cluster has no default class and the academy
  # needs to name one for us.
---
apiVersion: v1
kind: Service
metadata:
  name: ksgaal-postgres
  labels:
    app.kubernetes.io/name: ksgaal-postgres
    app.kubernetes.io/part-of: ksgaal-activity-map
spec:
  type: ClusterIP
  selector:
    app: ksgaal-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksgaal-postgres
  labels:
    app.kubernetes.io/name: ksgaal-postgres
    app.kubernetes.io/part-of: ksgaal-activity-map
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the volume is ReadWriteOnce, so a second pod
  # would block forever waiting for a claim the old pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ksgaal-postgres
  template:
    metadata:
      labels:
        app: ksgaal-postgres
        app.kubernetes.io/name: ksgaal-postgres
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ocir-pull-secret
      # 70 is the postgres user in the alpine image. Running as that user
      # rather than root keeps the pod acceptable under a restricted pod
      # security policy, and fsGroup gives initdb a writable volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: POSTGRES_IMAGE_REF
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # A mounted volume's root can already contain lost+found, which
            # makes initdb refuse to run. Keep the cluster in a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: ksgaal-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ksgaal", "-d", "ksgaal"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ksgaal", "-d", "ksgaal"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ksgaal-postgres-data
