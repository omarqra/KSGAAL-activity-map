apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ksgaal-activity-map
# Replaces the entire tls + rules block from the base Ingress.
# dev.example.com and the TLS secret name are placeholders pending the
# academy's development hostname and certificate.
spec:
  tls:
    - hosts:
        - dev.example.com
      secretName: ksgaal-dev-tls
  rules:
    - host: dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ksgaal-activity-map
                port:
                  number: 80
