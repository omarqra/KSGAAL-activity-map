apiVersion: v1
kind: ConfigMap
metadata:
  name: ksgaal-activity-map-config
  # namespace is injected by kustomize overlay
  labels:
    app.kubernetes.io/name: ksgaal-activity-map
    app.kubernetes.io/part-of: ksgaal-activity-map
# Non-secret runtime config. Secrets (DATABASE_URL, JWT_SECRET, SMTP_USER,
# SMTP_PASS, ADMIN_*) live in the Secret resource — never here.
#
# Environment-specific values (APP_ENV, APP_URL, NEXT_PUBLIC_*, EMAIL_FROM,
# SMTP_HOST) are overridden by each overlay's configmap-patch.yaml.
data:
  NODE_ENV: "production"
  PORT: "3000"
  SESSION_TTL_DAYS: "7"
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
  # ---- overridden per environment ----
  APP_ENV: "prod"
  SMTP_HOST: "smtp.example.com"
  EMAIL_FROM: "KSGAAL <no-reply@example.com>"
  APP_URL: "https://example.com"
  # NEXT_PUBLIC_* are baked into the client bundle at Docker build time.
  # Keeping them in the ConfigMap ensures server-side reads stay consistent
  # with what was baked in, but a fresh Docker build is required if URLs change.
  NEXT_PUBLIC_FRONTEND_URL: "https://example.com"
  NEXT_PUBLIC_BACKEND_URL: "https://example.com"
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ""
