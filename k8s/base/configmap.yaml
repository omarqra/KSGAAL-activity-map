apiVersion: v1
kind: ConfigMap
metadata:
  name: ksgaal-activity-map-config
  # namespace is injected by kustomize overlay
  labels:
    app.kubernetes.io/name: ksgaal-activity-map
    app.kubernetes.io/part-of: ksgaal-activity-map
# Static runtime config only — values that are the same in every environment
# and are safe to read in a pull request.
#
# Everything that varies per environment (APP_URL, SMTP_HOST, EMAIL_FROM,
# NEXT_PUBLIC_*) deliberately does NOT live here any more. It used to, as
# `example.com` placeholders, next to the same keys in the `aatw-dev` variable
# group — two sources for one value, which is how the browser ends up calling
# a hostname the server has never heard of. The pipeline now writes all of it
# into the Secret from the variable group, so there is exactly one place to
# set an environment's configuration.
data:
  NODE_ENV: "production"
  PORT: "3000"
  SESSION_TTL_DAYS: "7"
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
