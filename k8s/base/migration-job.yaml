apiVersion: batch/v1
kind: Job
metadata:
  name: ksgaal-activity-map-migrate
  # namespace injected by `kubectl apply -n <ns> -f` in the pipeline
  labels:
    app.kubernetes.io/name: ksgaal-activity-map
    app.kubernetes.io/part-of: ksgaal-activity-map
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ksgaal-activity-map
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Created by the pipeline from the OCIR credentials in the
      # aatw-dev variable group — OCIR repositories are private.
      imagePullSecrets:
        - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          # Placeholder replaced by sed in the pipeline before apply. The
          # whole reference is one token on purpose: the repository name is
          # the academy's to choose, and hardcoding it here once meant these
          # manifests silently kept pointing at the old one.
          image: IMAGE_REF
          imagePullPolicy: IfNotPresent
          # Migrations create the tables; the bootstrap makes the product
          # usable — it upserts the built-in roles and the admin account.
          # Without it a fresh deploy has a correct schema and no way to sign
          # in. Both steps are idempotent, so re-running is safe.
          #
          # Note this is NOT `npm run db:deploy`: that ends in `prisma db
          # seed`, which deletes every activity, type, organization and
          # country before importing. It must never run against a deployed
          # database.
          command: ["sh", "-c"]
          #
          # `npx prisma` does not work in this image and the run on
          # 2026-09-21 failed with `sh: prisma: not found`. The Dockerfile
          # copies the `prisma` package but not `node_modules/.bin`, so the
          # shim npx looks for is absent. Invoke the CLI entry point the
          # package declares instead — the same workaround CLAUDE.md already
          # records for this repo.
          #
          # `--schema` is explicit because prisma.config.ts is not in the
          # runtime image: it is TypeScript and there is no loader here. With
          # no config file the CLI falls back to the schema's own datasource,
          # which reads DATABASE_URL from the environment — exactly what the
          # Secret provides.
          args:
            - |
              set -e
              node node_modules/prisma/build/index.js migrate deploy \
                --schema prisma/schema.prisma
              node prisma-dist/bootstrap.cjs
          envFrom:
            - configMapRef:
                name: ksgaal-activity-map-config
            - secretRef:
                name: ksgaal-activity-map-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
