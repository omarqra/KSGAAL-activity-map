apiVersion: batch/v1
kind: Job
metadata:
  name: ksgaal-activity-map-migrate
  # namespace injected by `kubectl apply -n <ns> -f` in the pipeline
  labels:
    app.kubernetes.io/name: ksgaal-activity-map
    app.kubernetes.io/part-of: ksgaal-activity-map
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ksgaal-activity-map
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: migrate
          # Placeholder replaced by sed in the pipeline before apply.
          image: ACR_LOGIN_SERVER/ksgaal-activity-map:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: ksgaal-activity-map-config
            - secretRef:
                name: ksgaal-activity-map-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
