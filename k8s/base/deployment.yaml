apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksgaal-activity-map
  # namespace injected by `kubectl apply -n <ns> -f` in the pipeline
  labels:
    app.kubernetes.io/name: ksgaal-activity-map
    app.kubernetes.io/part-of: ksgaal-activity-map
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ksgaal-activity-map
  template:
    metadata:
      labels:
        app: ksgaal-activity-map
        app.kubernetes.io/name: ksgaal-activity-map
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: app
          # Placeholder replaced by sed in the pipeline before apply.
          image: REGISTRY_HOST/ksgaal-activity-map:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ksgaal-activity-map-config
            - secretRef:
                name: ksgaal-activity-map-secrets
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
