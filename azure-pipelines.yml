# ---------------------------------------------------------------------------
# Azure DevOps pipeline — ksgaal-activity-map
# Target: the academy's internal Azure DevOps Server (devops.ksaa.gov.sa),
#         collection Dev_Vendors, project Arabic-Around-theWorld.
#
# Everything below was verified by probe runs on 2026-09-09, not assumed:
#   • Agent pool `Default`, single self-hosted Linux agent KMO-ANSB-TOOL01.
#     There are NO Microsoft-hosted agents — `vmImage` cannot be used.
#   • Docker is installed, usable by the agent account, and can reach the
#     internet. Node is NOT installed — NodeTool below installs it.
#   • Service connection `development-AATW` is a Kubernetes connection using
#     token auth for service account `azdevops-dev` in namespace `dev`.
#     It has full rights inside `dev` and none at cluster scope, so this
#     pipeline never creates a Namespace.
#   • The academy's registry is Oracle Cloud's OCIR in Jeddah,
#     jed.ocir.io/axzbw7rafu2r — read off the images their other projects
#     have pulled onto this same agent.
#   • Only one environment exists: `development`.
#
# Added 2026-09-20, from the academy: a Docker Registry service connection
# `Docker_AATW`, and the repository `aatw/dev` to push into. That connection
# holds the credentials, so this pipeline never sees a registry username or
# token — Azure DevOps performs the login, and the same connection is handed
# to the Kubernetes task to mint the cluster's imagePullSecret. The earlier
# OCIR_USERNAME / OCIR_TOKEN variables are gone; do not reintroduce them.
#
# Variable group `aatw-dev` must be created in Library with:
#   non-secret:  APP_URL, NEXT_PUBLIC_FRONTEND_URL, NEXT_PUBLIC_BACKEND_URL,
#                NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
#   secret:      DATABASE_URL, JWT_SECRET, SMTP_USER, SMTP_PASS,
#                ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME
#
# NEXT_PUBLIC_* are baked into the client bundle at image build time.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: kubernetesServiceConnection
    value: "development-AATW"
  - name: k8sNamespace
    value: "dev"

  # Oracle Cloud Infrastructure Registry, Jeddah region.
  # Full image path: jed.ocir.io/axzbw7rafu2r/aatw/dev:<buildId>
  #
  # `aatw/dev` is the repository the academy allocated on 2026-09-20. OCIR
  # repository names may contain slashes, so this is one repository, not a
  # namespace plus a repository — every build lands here and is told apart by
  # its tag.
  - name: registryHost
    value: "jed.ocir.io"
  - name: registryNamespace
    value: "axzbw7rafu2r"
  - name: imageRepository
    value: "aatw/dev"

  # Docker Registry service connection. It carries the credentials, which is
  # why none appear anywhere in this file.
  - name: dockerRegistryServiceConnection
    value: "Docker_AATW"

  - name: dockerfilePath
    value: "Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"

  # V8 heap ceiling for every Node process this pipeline starts, on the agent
  # and inside the image build.
  #
  # The diagnostic step measured the agent on 2026-09-14: 3.8 GiB total RAM,
  # 2.2 GiB already held by the endpoint-security and patching daemons it runs
  # for the academy, **1.3 GiB available**, and zero swap. The previous 2048
  # ceiling was therefore above the machine's entire free memory and bought
  # nothing. 1024 is what actually fits under 1.3 GiB with room for npm's own
  # overhead. Raise this the moment the agent gets more RAM — `next build`
  # wants far more than 1 GiB and the image build in Stage 2 will still not
  # fit on this machine.
  - name: nodeHeapMb
    value: "1024"

  - group: aatw-dev

stages:
  # =========================================================================
  # Stage 1 — Validate. Runs on every PR and push. No cluster, no registry.
  #
  # Tuned for KMO-ANSB-TOOL01, which is shared with the academy's other teams.
  # `npm ci` was killed there three times; run #20260909.4 gave the cause with
  # no ambiguity: `Killed` / `Bash exited with code '137'` — SIGKILL from the
  # kernel OOM killer. The agent has too little free RAM, so every choice below
  # exists to cut peak memory:
  #   • `npm run build` was removed — the image build in Stage 2 runs the exact
  #     same `npm ci` + `prisma generate` + `next build`, so keeping it here
  #     compiled the whole app twice on one starved machine. `tsc --noEmit`
  #     still gates type errors.
  #   • NODE_OPTIONS caps V8's heap. Uncapped, Node grows until the kernel
  #     kills it (137) and takes the agent's connection down with it; capped,
  #     it collects garbage harder and, worst case, fails with a readable
  #     "JavaScript heap out of memory" instead of a silent death.
  #   • npm's audit/fund/progress network chatter and husky's git hooks are off.
  #   • Shallow clone and a hard timeout so a stall fails fast, not after an
  #     hour of holding the only agent in the pool.
  # =========================================================================
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: Validate
        pool:
          name: Default
        timeoutInMinutes: 30
        variables:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=$(nodeHeapMb)"
          - name: NEXT_TELEMETRY_DISABLED
            value: "1"
          - name: HUSKY
            value: "0"
          - name: npm_config_audit
            value: "false"
          - name: npm_config_fund
            value: "false"
          - name: npm_config_progress
            value: "false"
        steps:
          - checkout: self
            fetchDepth: 1

          # Runs in about a second. If the agent dies again, this is the log
          # line that says whether it ran out of memory, disk, or CPU.
          - bash: |
              echo "--- cpu ---";    nproc
              echo "--- memory ---"; free -h  || true
              echo "--- swap ---";   swapon --show || echo "no swap"
              echo "--- top memory consumers on this shared agent ---"
              ps -eo pid,user,rss,comm --sort=-rss | head -12 || true
              echo "--- disk ---";   df -h "$(Agent.WorkFolder)" / /tmp || true
              echo "--- load ---";   uptime   || true
            displayName: "Agent resources (diagnostic)"
            continueOnError: true

          # The agent has no Node at all, so this task is mandatory rather
          # than a version pin. It downloads Node — safe, internet is open.
          - task: NodeTool@0
            displayName: "Install Node 20"
            inputs:
              versionSpec: "20.x"

          # --prefer-offline reuses the agent's ~/.npm cache across runs, which
          # persists because the agent is self-hosted. --maxsockets throttles
          # parallel downloads: the default of 15 is what pinned this machine.
          - bash: |
              set -euo pipefail
              npm ci --prefer-offline --no-audit --no-fund --maxsockets 3
            displayName: "npm ci"

          - bash: |
              set -euo pipefail
              npx prisma generate
            displayName: "prisma generate"
            env:
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"

          # Reporting, not gating — deliberately, and temporarily.
          #
          # As of 2026-09-14 lint is clean of warnings but still has 36 errors
          # that predate this pipeline: 17 `@typescript-eslint/no-explicit-any`
          # and 19 from the React Compiler rules eslint-config-next enables for
          # Next 16. Clearing them means reworking component internals across
          # ~25 files in the admin UI, which needs visual verification that
          # cannot happen from a CI log. Blocking the academy's first
          # deployment on them would be this pipeline inventing a standard the
          # codebase was never held to.
          #
          # `continueOnError` keeps the full report in the run — the job shows
          # as "succeeded with issues", so the count stays in everyone's face
          # instead of disappearing behind a `|| true`. Flip this back to a
          # hard gate once the 36 are cleared.
          - bash: |
              set -euo pipefail
              npm run lint
            displayName: "npm run lint (report only — 36 known issues)"
            continueOnError: true

          # Next generates the global route/page/layout types (LayoutProps,
          # PageProps, ...) that `tsc` needs, and it normally does so as part
          # of `next build` — which was removed above to save memory. `typegen`
          # produces the same declarations without building: 0.8s and ~220 MB,
          # which this agent can afford.
          - bash: |
              set -euo pipefail
              npx next typegen
            displayName: "next typegen"
            env:
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"
              JWT_SECRET: "ci-placeholder-not-used-at-runtime-32chars!"

          - bash: |
              set -euo pipefail
              npm run ts-check
            displayName: "npm run ts-check"

  # =========================================================================
  # Stage 2 — Build and push to OCIR. Main branch only.
  #
  # Plain docker commands rather than the Docker@2 task: that task requires a
  # Docker Registry service connection, and the project has none. Logging in
  # from credentials in the variable group needs nothing created on the
  # academy's side beyond the two values themselves.
  # =========================================================================
  - stage: BuildAndPush
    displayName: "Build and push image"
    dependsOn: Validate
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Docker
        pool:
          name: Default
        timeoutInMinutes: 60
        steps:
          # Build before logging in, on purpose.
          #
          # `docker build` touches no registry, so putting it first means the
          # run reaches the one question still open on our side even if the
          # registry is unreachable: can an agent with 1.3 GiB of free RAM
          # compile this app at all? A clean "JavaScript heap out of memory"
          # or a 137 here is the measurement that turns the RAM request into a
          # number instead of an opinion.
          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker build \
                -f "$(dockerfilePath)" \
                -t "$IMAGE:$(tag)" \
                -t "$IMAGE:latest" \
                --build-arg NODE_HEAP_MB="$(nodeHeapMb)" \
                --build-arg NEXT_PUBLIC_FRONTEND_URL="$(NEXT_PUBLIC_FRONTEND_URL)" \
                --build-arg NEXT_PUBLIC_BACKEND_URL="$(NEXT_PUBLIC_BACKEND_URL)" \
                --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)" \
                "$(Build.SourcesDirectory)"
            displayName: "Build image"

          # Azure DevOps reads the credentials out of the service connection
          # and runs `docker login` itself, so no secret is ever materialised
          # as a pipeline variable or passed through a shell.
          - task: Docker@2
            displayName: "Log in to the registry"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker push "$IMAGE:$(tag)"
              docker push "$IMAGE:latest"
            displayName: "Push image"

          # The agent is shared with the academy's other projects — do not
          # leave our credentials in its Docker config.
          - bash: docker logout "$(registryHost)"
            displayName: "Log out of OCIR"
            condition: always()

          # Same reason: the agent has 45 GiB free and each build of this app
          # adds about a gigabyte. Drop only this build's own tags — never a
          # blanket `docker image prune`, which would delete layers belonging
          # to the academy's other projects on this machine.
          - bash: |
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker image rm "$IMAGE:$(tag)" "$IMAGE:latest" 2>/dev/null || true
            displayName: "Remove this build's local image tags"
            condition: always()

  # =========================================================================
  # Stage 3 — Deploy to the `development` environment (namespace `dev`).
  # =========================================================================
  - stage: DeployDevelopment
    displayName: "Deploy — development"
    dependsOn: BuildAndPush
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevelopment
        environment: development
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                # Manifests come straight from the repo at this commit rather
                # than a pipeline artifact — same content, one less service.
                - checkout: self

                - task: Kubernetes@1
                  displayName: "Authenticate kubectl"
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(k8sNamespace)
                    command: login

                - bash: |
                    set -euo pipefail
                    BASE="$(Build.SourcesDirectory)/k8s/base"
                    IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository):$(tag)"
                    echo "Deploying image: $IMAGE"
                    sed -i \
                      -e "s#IMAGE_REF#$IMAGE#g" \
                      "$BASE/deployment.yaml" \
                      "$BASE/migration-job.yaml"
                  displayName: "Substitute image placeholders"

                # OCIR repositories are private, so the cluster needs its
                # own credentials to pull. The Kubernetes task builds the
                # dockerconfigjson from the Docker_AATW service connection, so
                # the token never passes through this pipeline's shell or its
                # variables. `forceUpdate` rewrites the secret every run, which
                # keeps it correct if the academy ever rotates the credential.
                - task: Kubernetes@1
                  displayName: "Create/update image pull secret"
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(k8sNamespace)
                    secretType: dockerRegistry
                    containerRegistryType: Container Registry
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)
                    secretName: ocir-pull-secret
                    forceUpdate: true
                    command: login

                # ConfigMap, Service, Ingress. The overlay contains no
                # Namespace resource — the token cannot create one, and `dev`
                # already exists.
                - bash: |
                    set -euo pipefail
                    kubectl apply -k \
                      "$(Build.SourcesDirectory)/k8s/overlays/dev/"
                  displayName: "Apply ConfigMap, Service, Ingress"

                # Secret values come from the aatw-dev group. They are passed
                # through the shell environment only — never written to a file
                # and never echoed; Azure DevOps masks secret variables in logs.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" create secret generic \
                      ksgaal-activity-map-secrets \
                      --from-literal=DATABASE_URL="$SECRET_DATABASE_URL" \
                      --from-literal=JWT_SECRET="$SECRET_JWT_SECRET" \
                      --from-literal=SMTP_USER="$SECRET_SMTP_USER" \
                      --from-literal=SMTP_PASS="$SECRET_SMTP_PASS" \
                      --from-literal=ADMIN_EMAIL="$SECRET_ADMIN_EMAIL" \
                      --from-literal=ADMIN_PASSWORD="$SECRET_ADMIN_PASSWORD" \
                      --from-literal=ADMIN_NAME="$SECRET_ADMIN_NAME" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: "Create/update Kubernetes Secret"
                  env:
                    SECRET_DATABASE_URL: $(DATABASE_URL)
                    SECRET_JWT_SECRET: $(JWT_SECRET)
                    SECRET_SMTP_USER: $(SMTP_USER)
                    SECRET_SMTP_PASS: $(SMTP_PASS)
                    SECRET_ADMIN_EMAIL: $(ADMIN_EMAIL)
                    SECRET_ADMIN_PASSWORD: $(ADMIN_PASSWORD)
                    SECRET_ADMIN_NAME: $(ADMIN_NAME)

                # A Job is immutable, so the previous one must go before the
                # new one can be applied.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" delete job \
                      ksgaal-activity-map-migrate \
                      --ignore-not-found=true
                  displayName: "Remove previous migration Job"

                - bash: |
                    set -euo pipefail
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Build.SourcesDirectory)/k8s/base/migration-job.yaml"
                  displayName: "Apply migration Job"

                # Migrations must succeed before the Deployment is touched,
                # otherwise new pods would start against an old schema.
                - bash: |
                    set -euo pipefail
                    if ! kubectl -n "$(k8sNamespace)" wait \
                        --for=condition=complete \
                        --timeout=300s \
                        job/ksgaal-activity-map-migrate; then
                      echo "##[error] Migration Job failed or timed out. Logs:"
                      kubectl -n "$(k8sNamespace)" logs \
                        job/ksgaal-activity-map-migrate --tail=500 || true
                      exit 1
                    fi
                  displayName: "Wait for migration Job"

                - bash: |
                    set -euo pipefail
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Build.SourcesDirectory)/k8s/base/deployment.yaml"
                  displayName: "Apply Deployment"

                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" rollout status \
                      deployment/ksgaal-activity-map \
                      --timeout=300s
                  displayName: "Wait for rollout"
