# ---------------------------------------------------------------------------
# Azure DevOps pipeline — ksgaal-activity-map
# Target: the academy's internal Azure DevOps Server (devops.ksaa.gov.sa),
#         collection Dev_Vendors, project Arabic-Around-theWorld.
#
# Everything below was verified by probe runs on 2026-09-09, not assumed:
#   • Agent pool `Default`, single self-hosted Linux agent KMO-ANSB-TOOL01.
#     There are NO Microsoft-hosted agents — `vmImage` cannot be used.
#   • Docker is installed, usable by the agent account, and can reach the
#     internet. Node is NOT installed — NodeTool below installs it.
#   • Service connection `development-AATW` is a Kubernetes connection using
#     token auth for service account `azdevops-dev` in namespace `dev`.
#     It has full rights inside `dev` and none at cluster scope, so this
#     pipeline never creates a Namespace.
#   • The academy's registry is Oracle Cloud's OCIR in Jeddah,
#     jed.ocir.io/axzbw7rafu2r — read off the images their other projects
#     have pulled onto this same agent.
#   • Only one environment exists: `development`.
#
# Added 2026-09-20, from the academy: a Docker Registry service connection
# `Docker_AATW`, and the repository `aatw/dev` to push into. That connection
# holds the credentials, so this pipeline never sees a registry username or
# token — Azure DevOps performs the login, and the same connection is handed
# to the Kubernetes task to mint the cluster's imagePullSecret. The earlier
# OCIR_USERNAME / OCIR_TOKEN variables are gone; do not reintroduce them.
#
# There is no .env anywhere in this deployment. Every environment-specific
# value is set once, in the `aatw-dev` variable group under Pipelines >
# Library, and the pipeline turns the whole set into one Kubernetes Secret.
# Static config that never varies by environment stays in k8s/base/configmap.yaml.
#
# Nothing here is strictly required any more — a deploy with an empty group
# still completes, it just does less. That is deliberate: the academy has
# supplied these piecemeal over weeks, and a pipeline that refuses to run
# until the last one arrives cannot show them anything in the meantime.
#
#   JWT_SECRET      >= 32 random characters  [mark secret]. The one value
#                   worth setting immediately — sessions depend on it.
#
#   ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME  [mark the password secret].
#                   Without them no account is created and the dashboard
#                   cannot be signed into.
#
#   DATABASE_URL    Ignored while deployInClusterPostgres is on. With it off
#                   and this empty, the app runs degraded: empty globe,
#                   migrations skipped, readiness still green.
#
#   SMTP_HOST, SMTP_USER, SMTP_PASS, EMAIL_FROM   [mark the credentials
#                   secret]. Empty means email features are unavailable.
#
#   APP_URL         Only used for links inside emails, which are read outside
#                   the cluster and so need an absolute address.
#
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY   Empty disables the features needing it.
#
#   NEXT_PUBLIC_FRONTEND_URL, NEXT_PUBLIC_BACKEND_URL
#                   Leave both empty. That is the supported setup, not a
#                   shortcut: the browser calls the origin that served the
#                   page and server components call loopback, so one image
#                   works behind the temporary node port, a real ingress, or
#                   localhost, and the hostname arriving needs no rebuild.
#                   FRONTEND_URL only adds SEO canonical tags when set.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: kubernetesServiceConnection
    value: "development-AATW"
  - name: k8sNamespace
    value: "dev"

  # Oracle Cloud Infrastructure Registry, Jeddah region.
  # Full image path: jed.ocir.io/axzbw7rafu2r/aatw/dev:<buildId>
  #
  # `aatw/dev` is the repository the academy allocated on 2026-09-20. OCIR
  # repository names may contain slashes, so this is one repository, not a
  # namespace plus a repository — every build lands here and is told apart by
  # its tag.
  - name: registryHost
    value: "jed.ocir.io"
  - name: registryNamespace
    value: "axzbw7rafu2r"
  - name: imageRepository
    value: "aatw/dev"

  # Docker Registry service connection. It carries the credentials, which is
  # why none appear anywhere in this file.
  - name: dockerRegistryServiceConnection
    value: "Docker_AATW"

  # The academy confirmed the development database is to be created inside
  # the cluster rather than provisioned separately. The pipeline mirrors the
  # official PostgreSQL image through their registry (the nodes cannot reach
  # Docker Hub) and runs it in `dev`. Set to "false" to point the app at an
  # external database through the DATABASE_URL variable instead.
  - name: deployInClusterPostgres
    value: "true"
  - name: postgresSourceImage
    value: "postgres:16-alpine"
  # Pushed as a tag of the one repository the academy allocated, rather than
  # asking them for a second one.
  - name: postgresImageTag
    value: "postgres-16-alpine"

  # Temporary: expose the app on a node port so it can be opened from a
  # browser inside the academy's network before they supply a hostname and
  # certificate for the Ingress. Set to "false" and delete the Service once
  # the Ingress routes — see k8s/overlays/dev/nodeport-service.yaml.
  - name: exposeNodePort
    value: "true"

  - name: dockerfilePath
    value: "Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"

  # V8 heap ceiling for every Node process this pipeline starts, on the agent
  # and inside the image build.
  #
  # The diagnostic step measured the agent on 2026-09-14: 3.8 GiB total RAM,
  # 2.2 GiB already held by the endpoint-security and patching daemons it runs
  # for the academy, **1.3 GiB available**, and zero swap. The previous 2048
  # ceiling was therefore above the machine's entire free memory and bought
  # nothing. 1024 is what actually fits under 1.3 GiB with room for npm's own
  # overhead. Raise this the moment the agent gets more RAM — `next build`
  # wants far more than 1 GiB and the image build in Stage 2 will still not
  # fit on this machine.
  - name: nodeHeapMb
    value: "1024"

  - group: aatw-dev

stages:
  # =========================================================================
  # Stage 1 — Validate. Runs on every PR and push. No cluster, no registry.
  #
  # Tuned for KMO-ANSB-TOOL01, which is shared with the academy's other teams.
  # `npm ci` was killed there three times; run #20260909.4 gave the cause with
  # no ambiguity: `Killed` / `Bash exited with code '137'` — SIGKILL from the
  # kernel OOM killer. The agent has too little free RAM, so every choice below
  # exists to cut peak memory:
  #   • `npm run build` was removed — the image build in Stage 2 runs the exact
  #     same `npm ci` + `prisma generate` + `next build`, so keeping it here
  #     compiled the whole app twice on one starved machine. `tsc --noEmit`
  #     still gates type errors.
  #   • NODE_OPTIONS caps V8's heap. Uncapped, Node grows until the kernel
  #     kills it (137) and takes the agent's connection down with it; capped,
  #     it collects garbage harder and, worst case, fails with a readable
  #     "JavaScript heap out of memory" instead of a silent death.
  #   • npm's audit/fund/progress network chatter and husky's git hooks are off.
  #   • Shallow clone and a hard timeout so a stall fails fast, not after an
  #     hour of holding the only agent in the pool.
  # =========================================================================
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: Validate
        pool:
          name: Default
        timeoutInMinutes: 30
        variables:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=$(nodeHeapMb)"
          - name: NEXT_TELEMETRY_DISABLED
            value: "1"
          - name: HUSKY
            value: "0"
          - name: npm_config_audit
            value: "false"
          - name: npm_config_fund
            value: "false"
          - name: npm_config_progress
            value: "false"
        steps:
          - checkout: self
            fetchDepth: 1

          # Runs in about a second. If the agent dies again, this is the log
          # line that says whether it ran out of memory, disk, or CPU.
          - bash: |
              echo "--- cpu ---";    nproc
              echo "--- memory ---"; free -h  || true
              echo "--- swap ---";   swapon --show || echo "no swap"
              echo "--- top memory consumers on this shared agent ---"
              ps -eo pid,user,rss,comm --sort=-rss | head -12 || true
              echo "--- disk ---";   df -h "$(Agent.WorkFolder)" / /tmp || true
              echo "--- load ---";   uptime   || true
            displayName: "Agent resources (diagnostic)"
            continueOnError: true

          # The agent has no Node at all, so this task is mandatory rather
          # than a version pin. It downloads Node — safe, internet is open.
          - task: NodeTool@0
            displayName: "Install Node 20"
            inputs:
              versionSpec: "20.x"

          # --prefer-offline reuses the agent's ~/.npm cache across runs, which
          # persists because the agent is self-hosted. --maxsockets throttles
          # parallel downloads: the default of 15 is what pinned this machine.
          # The control for the variable-group problem seen in the deploy
          # stage. This is an ordinary job; if the group resolves here but
          # not there, the difference is the job type, not the group.
          # Single-quoted so bash never executes whatever is left behind, and
          # neither value is a secret.
          - bash: |
              echo 'ordinary job, ADMIN_EMAIL = [$(ADMIN_EMAIL)]'
              echo 'ordinary job, APP_ENV     = [$(APP_ENV)]'
            displayName: "Variable group reachability (diagnostic)"
            continueOnError: true

          - bash: |
              set -euo pipefail
              npm ci --prefer-offline --no-audit --no-fund --maxsockets 3
            displayName: "npm ci"

          - bash: |
              set -euo pipefail
              npx prisma generate
            displayName: "prisma generate"
            env:
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"

          # Reporting, not gating — deliberately, and temporarily.
          #
          # As of 2026-09-14 lint is clean of warnings but still has 36 errors
          # that predate this pipeline: 17 `@typescript-eslint/no-explicit-any`
          # and 19 from the React Compiler rules eslint-config-next enables for
          # Next 16. Clearing them means reworking component internals across
          # ~25 files in the admin UI, which needs visual verification that
          # cannot happen from a CI log. Blocking the academy's first
          # deployment on them would be this pipeline inventing a standard the
          # codebase was never held to.
          #
          # `continueOnError` keeps the full report in the run — the job shows
          # as "succeeded with issues", so the count stays in everyone's face
          # instead of disappearing behind a `|| true`. Flip this back to a
          # hard gate once the 36 are cleared.
          - bash: |
              set -euo pipefail
              npm run lint
            displayName: "npm run lint (report only — 36 known issues)"
            continueOnError: true

          # Next generates the global route/page/layout types (LayoutProps,
          # PageProps, ...) that `tsc` needs, and it normally does so as part
          # of `next build` — which was removed above to save memory. `typegen`
          # produces the same declarations without building: 0.8s and ~220 MB,
          # which this agent can afford.
          - bash: |
              set -euo pipefail
              npx next typegen
            displayName: "next typegen"
            env:
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"
              JWT_SECRET: "ci-placeholder-not-used-at-runtime-32chars!"

          - bash: |
              set -euo pipefail
              npm run ts-check
            displayName: "npm run ts-check"

  # =========================================================================
  # Stage 2 — Build and push to OCIR. Main branch only.
  #
  # Plain docker commands rather than the Docker@2 task: that task requires a
  # Docker Registry service connection, and the project has none. Logging in
  # from credentials in the variable group needs nothing created on the
  # academy's side beyond the two values themselves.
  # =========================================================================
  - stage: BuildAndPush
    displayName: "Build and push image"
    dependsOn: Validate
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Docker
        pool:
          name: Default
        timeoutInMinutes: 60
        steps:
          # Build before logging in, on purpose.
          #
          # `docker build` touches no registry, so putting it first means the
          # run reaches the one question still open on our side even if the
          # registry is unreachable: can an agent with 1.3 GiB of free RAM
          # compile this app at all? Run #20260920 answered it — the build got
          # as far as "Collecting page data", so the memory is sufficient.
          #
          # The NEXT_PUBLIC_* values arrive through `env:` rather than inline
          # $(...) for a reason that cost a 20-minute build: when a variable is
          # not defined in the group, Azure DevOps leaves the literal text
          # `$(NAME)` behind, bash reads that as a command substitution, the
          # command does not exist, and the build-arg is passed as an empty
          # string — which *overrides* the Dockerfile's default instead of
          # falling back to it. `next build` then failed on "Invalid URL" deep
          # into the run. Read them as environment variables, check them, and
          # only pass the ones that actually have a value.
          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"

              ARGS=()
              warn=""
              add_public() {
                local name="$1" value="$2"
                case "$value" in
                  ""|'$('*')')
                    warn="$warn $name"
                    ;;
                  *)
                    ARGS+=(--build-arg "$name=$value")
                    ;;
                esac
              }

              add_public NEXT_PUBLIC_FRONTEND_URL "${V_FRONTEND_URL:-}"
              add_public NEXT_PUBLIC_BACKEND_URL "${V_BACKEND_URL:-}"
              add_public NEXT_PUBLIC_GOOGLE_MAPS_API_KEY "${V_MAPS_KEY:-}"

              if [ -n "$warn" ]; then
                echo "##vso[task.logissue type=warning]Not set in the aatw-dev variable group:$warn"
                echo "##vso[task.logissue type=warning]Falling back to the Dockerfile defaults so the build can complete."
                echo "##vso[task.logissue type=warning]The browser bundle bakes these in, so set them and rebuild before anyone uses this image."
              fi

              docker build \
                -f "$(dockerfilePath)" \
                -t "$IMAGE:$(tag)" \
                -t "$IMAGE:latest" \
                --build-arg NODE_HEAP_MB="$(nodeHeapMb)" \
                "${ARGS[@]+"${ARGS[@]}"}" \
                "$(Build.SourcesDirectory)"
            displayName: "Build image"
            env:
              V_FRONTEND_URL: $(NEXT_PUBLIC_FRONTEND_URL)
              V_BACKEND_URL: $(NEXT_PUBLIC_BACKEND_URL)
              V_MAPS_KEY: $(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)

          # Azure DevOps reads the credentials out of the service connection
          # and runs `docker login` itself, so no secret is ever materialised
          # as a pipeline variable or passed through a shell.
          - task: Docker@2
            displayName: "Log in to the registry"
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker push "$IMAGE:$(tag)"
              docker push "$IMAGE:latest"
            displayName: "Push image"

          # Mirror PostgreSQL into the academy's registry.
          #
          # The cluster nodes have no outbound internet, so they cannot pull
          # postgres:16-alpine from Docker Hub. This agent can, and it can
          # push to their registry, so it acts as the bridge. Nothing about
          # the image is modified — only its address.
          - bash: |
              set -euo pipefail
              if [ "$(deployInClusterPostgres)" != "true" ]; then
                echo "In-cluster PostgreSQL is off — skipping the mirror."
                exit 0
              fi
              DST="$(registryHost)/$(registryNamespace)/$(imageRepository):$(postgresImageTag)"
              docker pull "$(postgresSourceImage)"
              docker tag "$(postgresSourceImage)" "$DST"
              docker push "$DST"
              echo "Mirrored $(postgresSourceImage) -> $DST"
            displayName: "Mirror PostgreSQL into the academy's registry"

          # The agent is shared with the academy's other projects — do not
          # leave our credentials in its Docker config.
          - bash: docker logout "$(registryHost)"
            displayName: "Log out of OCIR"
            condition: always()

          # Same reason: the agent has 45 GiB free and each build of this app
          # adds about a gigabyte. Drop only this build's own tags — never a
          # blanket `docker image prune`, which would delete layers belonging
          # to the academy's other projects on this machine.
          - bash: |
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker image rm "$IMAGE:$(tag)" "$IMAGE:latest" 2>/dev/null || true
            displayName: "Remove this build's local image tags"
            condition: always()

  # =========================================================================
  # Stage 3 — Deploy to the `development` environment (namespace `dev`).
  # =========================================================================
  - stage: DeployDevelopment
    displayName: "Deploy — development"
    dependsOn: BuildAndPush
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevelopment
        environment: development
        pool:
          name: Default
        # Bound here as well as at the root.
        #
        # Run 20260921.7 proved the group is authorised for this pipeline and
        # holds saved values, yet every one of them arrived empty in this
        # job's steps — including ADMIN_EMAIL, which is not a secret. The two
        # stages that did see them are ordinary jobs; this is a deployment
        # job, and on this Azure DevOps Server version the root-level binding
        # does not appear to reach one. Declaring it at job scope costs
        # nothing if the root binding was fine all along.
        variables:
          - group: aatw-dev
        strategy:
          runOnce:
            deploy:
              steps:
                # Manifests come straight from the repo at this commit rather
                # than a pipeline artifact — same content, one less service.
                - checkout: self

                - task: Kubernetes@1
                  displayName: "Authenticate kubectl"
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(k8sNamespace)
                    command: login

                - bash: |
                    set -euo pipefail
                    BASE="$(Build.SourcesDirectory)/k8s/base"
                    IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository):$(tag)"
                    echo "Deploying image: $IMAGE"
                    sed -i \
                      -e "s#IMAGE_REF#$IMAGE#g" \
                      "$BASE/deployment.yaml" \
                      "$BASE/migration-job.yaml"
                  displayName: "Substitute image placeholders"

                # OCIR repositories are private, so the cluster needs its
                # own credentials to pull. The Kubernetes task builds the
                # dockerconfigjson from the Docker_AATW service connection, so
                # the token never passes through this pipeline's shell or its
                # variables. `forceUpdate` rewrites the secret every run, which
                # keeps it correct if the academy ever rotates the credential.
                - task: Kubernetes@1
                  displayName: "Create/update image pull secret"
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(k8sNamespace)
                    secretType: dockerRegistry
                    containerRegistryType: Container Registry
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)
                    secretName: ocir-pull-secret
                    forceUpdate: true
                    command: login

                # ConfigMap, Service, Ingress. The overlay contains no
                # Namespace resource — the token cannot create one, and `dev`
                # already exists.
                - bash: |
                    set -euo pipefail
                    kubectl apply -k \
                      "$(Build.SourcesDirectory)/k8s/overlays/dev/"
                  displayName: "Apply ConfigMap, Service, Ingress"

                # ---- In-cluster PostgreSQL ------------------------------
                #
                # The credential is generated once and then left alone. Using
                # `create ... | apply` here would mint a new password on every
                # run while the database on disk still expects the old one,
                # and the app would start failing authentication after the
                # second deploy with nothing in the logs to explain it.
                #
                # Alphanumeric on purpose: the password goes into a
                # postgresql:// URL, and percent-encoding it portably in shell
                # is a trap not worth setting.
                - bash: |
                    set -euo pipefail
                    if [ "$(deployInClusterPostgres)" != "true" ]; then
                      echo "In-cluster PostgreSQL is off — skipping."
                      exit 0
                    fi

                    if kubectl -n "$(k8sNamespace)" get secret \
                         ksgaal-postgres-credentials >/dev/null 2>&1; then
                      echo "Credentials already exist — leaving them untouched."
                      exit 0
                    fi

                    # Read a bounded block and slice it in bash rather than
                    # piping into `head -c 32`. `head` closes the pipe the
                    # moment it has enough, `tr` dies of SIGPIPE, and under
                    # `pipefail` that surfaces as exit 141 with no output at
                    # all — which is exactly how run 20260921.3 failed.
                    RANDOM_BYTES=$(head -c 4096 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9')
                    PW="${RANDOM_BYTES:0:32}"
                    if [ "${#PW}" -ne 32 ]; then
                      echo "##[error] Could not generate a 32-character password."
                      exit 1
                    fi
                    kubectl -n "$(k8sNamespace)" create secret generic \
                      ksgaal-postgres-credentials \
                      --from-literal=POSTGRES_DB=ksgaal \
                      --from-literal=POSTGRES_USER=ksgaal \
                      --from-literal=POSTGRES_PASSWORD="$PW"
                    echo "Generated new PostgreSQL credentials."
                  displayName: "Ensure PostgreSQL credentials"

                - bash: |
                    set -euo pipefail
                    if [ "$(deployInClusterPostgres)" != "true" ]; then
                      echo "In-cluster PostgreSQL is off — skipping."
                      exit 0
                    fi

                    MANIFEST="$(Build.SourcesDirectory)/k8s/overlays/dev/postgres.yaml"
                    PG_IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository):$(postgresImageTag)"
                    sed -i "s#POSTGRES_IMAGE_REF#$PG_IMAGE#g" "$MANIFEST"
                    echo "PostgreSQL image: $PG_IMAGE"
                    kubectl apply -n "$(k8sNamespace)" -f "$MANIFEST"

                    # A Pending claim means the cluster has no default
                    # StorageClass. We cannot check that directly — those are
                    # cluster-scoped — so surface it as a readable failure
                    # rather than a ten-minute rollout timeout.
                    echo "Waiting for the volume claim to bind..."
                    PHASE=""
                    for i in $(seq 1 30); do
                      PHASE=$(kubectl -n "$(k8sNamespace)" get pvc \
                        ksgaal-postgres-data -o jsonpath='{.status.phase}' \
                        2>/dev/null || echo "")
                      [ "$PHASE" = "Bound" ] && break
                      sleep 5
                    done
                    if [ "$PHASE" != "Bound" ]; then
                      echo "##[error] The volume claim is still '$PHASE' after"
                      echo "##[error] 150s. The cluster most likely has no"
                      echo "##[error] default StorageClass — ask the academy"
                      echo "##[error] which one to name in postgres.yaml."
                      kubectl -n "$(k8sNamespace)" describe pvc ksgaal-postgres-data || true
                      exit 1
                    fi
                    echo "Volume bound."

                    if ! kubectl -n "$(k8sNamespace)" rollout status \
                        deployment/ksgaal-postgres --timeout=300s; then
                      echo "##[error] PostgreSQL did not become ready. Logs:"
                      kubectl -n "$(k8sNamespace)" logs \
                        deployment/ksgaal-postgres --tail=200 || true
                      kubectl -n "$(k8sNamespace)" describe \
                        deployment/ksgaal-postgres || true
                      exit 1
                    fi
                  displayName: "Deploy PostgreSQL in the cluster"

                # One place decides what the app connects to, so the Secret
                # and the migration Job can never disagree about it.
                - bash: |
                    set -euo pipefail
                    NS="$(k8sNamespace)"
                    if [ "$(deployInClusterPostgres)" = "true" ]; then
                      DB=$(kubectl -n "$NS" get secret ksgaal-postgres-credentials -o jsonpath='{.data.POSTGRES_DB}' | base64 -d)
                      USR=$(kubectl -n "$NS" get secret ksgaal-postgres-credentials -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)
                      PW=$(kubectl -n "$NS" get secret ksgaal-postgres-credentials -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
                      URL="postgresql://$USR:$PW@ksgaal-postgres:5432/$DB?schema=public"
                      echo "Using the in-cluster database at ksgaal-postgres:5432/$DB"
                    else
                      URL=$(cat <<'AATW_DB_EOF'
                    $(DATABASE_URL)
                    AATW_DB_EOF
                      )
                      # An unexpanded macro means "not defined". The two
                      # characters are assembled rather than written, because
                      # Azure DevOps would try to expand them here too.
                      DOLLAR='$'
                      case "$URL" in
                        "${DOLLAR}("*")" ) URL="" ;;
                      esac
                      if [ -n "$URL" ]; then
                        echo "Using the external database from DATABASE_URL."
                      else
                        echo "No database configured — the app deploys in"
                        echo "degraded mode and migrations are skipped."
                      fi
                    fi
                    echo "##vso[task.setvariable variable=resolvedDatabaseUrl;issecret=true]$URL"

                    # A separate, non-secret flag for the migration steps.
                    # They only need to know whether there is a database, and
                    # reading a secret variable just to test it for emptiness
                    # is more exposure than the question deserves.
                    if [ -n "$URL" ]; then
                      echo "##vso[task.setvariable variable=hasDatabase]true"
                    else
                      echo "##vso[task.setvariable variable=hasDatabase]false"
                    fi
                  displayName: "Resolve DATABASE_URL"

                # Every environment-specific value — secret or not — comes
                # from the aatw-dev variable group and lands in this one
                # Secret. Non-secret keys (APP_URL, SMTP_HOST, EMAIL_FROM,
                # NEXT_PUBLIC_*) sit here rather than in the ConfigMap on
                # purpose: they used to live in both, and a value set in one
                # and forgotten in the other is how the browser ends up
                # calling a hostname the server has never heard of. One place
                # to set an environment beats a tidier split.
                #
                # Values are passed through the shell environment only — never
                # written to a file, never echoed. Azure DevOps masks secret
                # variables in logs.
                - bash: |
                    set -euo pipefail

                    # Values arrive by inline macro expansion, not through an
                    # `env:` block.
                    #
                    # Run 20260921.9 settled why. Inside this deployment job
                    # an `env:` mapping delivers nothing — every one of the
                    # thirteen keys read back empty, including ADMIN_EMAIL,
                    # which is not a secret, and DATABASE_URL, which does not
                    # even come from the variable group but from the step
                    # above. The same run proved inline expansion works here:
                    # `$(ADMIN_EMAIL)` printed the address. Ordinary jobs are
                    # unaffected; the Validate stage reads the group fine.
                    #
                    # The heredoc delimiter is quoted, so bash performs no
                    # expansion on the block at all. That matters: Azure
                    # DevOps substitutes the values before bash sees them, and
                    # a password containing a quote would otherwise break the
                    # script or worse. The one input this cannot survive is a
                    # value containing a newline — none of these are
                    # multi-line, and the readout below would show it.
                    VALUES=$(cat <<'AATW_VALUES_EOF'
                    DATABASE_URL=$(resolvedDatabaseUrl)
                    JWT_SECRET=$(JWT_SECRET)
                    APP_URL=$(APP_URL)
                    SMTP_HOST=$(SMTP_HOST)
                    SMTP_USER=$(SMTP_USER)
                    SMTP_PASS=$(SMTP_PASS)
                    EMAIL_FROM=$(EMAIL_FROM)
                    NEXT_PUBLIC_FRONTEND_URL=$(NEXT_PUBLIC_FRONTEND_URL)
                    NEXT_PUBLIC_BACKEND_URL=$(NEXT_PUBLIC_BACKEND_URL)
                    NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)
                    ADMIN_EMAIL=$(ADMIN_EMAIL)
                    ADMIN_PASSWORD=$(ADMIN_PASSWORD)
                    ADMIN_NAME=$(ADMIN_NAME)
                    AATW_VALUES_EOF
                    )

                    # A macro Azure DevOps could not resolve is left in the
                    # text verbatim; that means "not defined", not a value.
                    # The two characters are assembled rather than written,
                    # or this pattern would be substituted as well.
                    DOLLAR='$'

                    declare -A clean
                    args=()
                    while IFS= read -r line; do
                      [ -n "$line" ] || continue
                      key="${line%%=*}"
                      val="${line#*=}"
                      case "$val" in
                        "${DOLLAR}("*")" ) val="" ;;
                      esac
                      clean[$key]="$val"
                      args+=(--from-literal="$key=$val")
                    done <<< "$VALUES"

                    # Names and lengths only — never values.
                    echo "--- aatw-dev readout (names and lengths only) ---"
                    for key in "${!clean[@]}"; do
                      if [ -z "${clean[$key]}" ]; then
                        state="empty"
                      else
                        state="set, ${#clean[$key]} characters"
                      fi
                      printf '  %-34s %s\n' "$key" "$state"
                    done | sort
                    echo "-------------------------------------------------"

                    # JWT_SECRET is the only hard stop left: sessions are
                    # signed with it, and its absence shows up as a redirect
                    # loop rather than anything a reader could diagnose.
                    if [ -z "${clean[JWT_SECRET]}" ]; then
                      echo "##[error] The image is built and pushed, but"
                      echo "##[error] JWT_SECRET is not set, so no one could"
                      echo "##[error] stay signed in."
                      echo "##[error] Set it (32+ random characters, marked"
                      echo "##[error] secret) in the aatw-dev variable group"
                      echo "##[error] under Pipelines > Library."
                      exit 1
                    fi

                    # Everything else degrades. Say exactly what will not work
                    # rather than failing the deploy.
                    if [ -z "${clean[ADMIN_EMAIL]}" ] || [ -z "${clean[ADMIN_PASSWORD]}" ]; then
                      echo "##vso[task.logissue type=warning]ADMIN_EMAIL / ADMIN_PASSWORD are not set — no admin account will be created and the dashboard cannot be signed into."
                    fi
                    if [ -z "${clean[SMTP_HOST]}" ] || [ -z "${clean[SMTP_USER]}" ]; then
                      echo "##vso[task.logissue type=warning]SMTP is not configured — password reset and OTP emails will not be sent."
                    fi
                    if [ -z "${clean[APP_URL]}" ]; then
                      echo "##vso[task.logissue type=warning]APP_URL is not set — links inside outgoing emails will be relative and unusable."
                    fi

                    kubectl -n "$(k8sNamespace)" create secret generic \
                      ksgaal-activity-map-secrets "${args[@]}" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: "Create/update Kubernetes Secret"

                # A Job is immutable, so the previous one must go before the
                # new one can be applied.
                - bash: |
                    set -euo pipefail
                    if [ "$(hasDatabase)" != "true" ]; then
                      echo "No database configured — skipping migrations."
                      echo "The app deploys in degraded mode: the public globe"
                      echo "serves empty and the admin screens report the gap."
                      exit 0
                    fi
                    kubectl -n "$(k8sNamespace)" delete job \
                      ksgaal-activity-map-migrate \
                      --ignore-not-found=true
                  displayName: "Remove previous migration Job"

                - bash: |
                    set -euo pipefail
                    if [ "$(hasDatabase)" != "true" ]; then
                      echo "No database configured — skipping migrations."
                      echo "The app deploys in degraded mode: the public globe"
                      echo "serves empty and the admin screens report the gap."
                      exit 0
                    fi
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Build.SourcesDirectory)/k8s/base/migration-job.yaml"
                  displayName: "Apply migration Job"

                # Migrations must succeed before the Deployment is touched,
                # otherwise new pods would start against an old schema.
                - bash: |
                    set -euo pipefail
                    if [ "$(hasDatabase)" != "true" ]; then
                      echo "No database configured — skipping migrations."
                      echo "The app deploys in degraded mode: the public globe"
                      echo "serves empty and the admin screens report the gap."
                      exit 0
                    fi
                    # Poll the Job's own condition instead of
                    # `kubectl wait --for=condition=complete`. That only
                    # watches for success, so a Job that gave up after its
                    # retries still burned the full timeout — the run on
                    # 2026-09-21 spent five minutes waiting for a container
                    # that had already died three times in seconds.
                    JOB="job/ksgaal-activity-map-migrate"
                    NS="$(k8sNamespace)"
                    STATE=""
                    for _ in $(seq 1 60); do
                      STATE=$(kubectl -n "$NS" get "$JOB" \
                        -o 'jsonpath={.status.conditions[?(@.status=="True")].type}' \
                        2>/dev/null || echo "")
                      case "$STATE" in
                        Complete|Failed) break ;;
                      esac
                      sleep 5
                    done

                    if [ "$STATE" = "Complete" ]; then
                      echo "Migrations applied and the database bootstrapped."
                      kubectl -n "$NS" logs "$JOB" --tail=100 || true
                      exit 0
                    fi

                    if [ "$STATE" = "Failed" ]; then
                      echo "##[error] The migration Job failed. Container logs:"
                    else
                      echo "##[error] The migration Job did not finish within"
                      echo "##[error] five minutes. Container logs so far:"
                    fi

                    # `logs job/...` picks one pod and says so. Walk every
                    # attempt: a first pod that crashed on startup and a later
                    # one that failed on the database say different things,
                    # and only seeing both tells them apart.
                    PODS=$(kubectl -n "$NS" get pods \
                      -l job-name=ksgaal-activity-map-migrate \
                      -o 'jsonpath={.items[*].metadata.name}' 2>/dev/null || echo "")
                    for pod in $PODS; do
                      echo "----- $pod -----"
                      kubectl -n "$NS" logs "$pod" --tail=200 || true
                    done
                    kubectl -n "$NS" describe "$JOB" || true
                    exit 1
                  displayName: "Wait for migration Job"

                - bash: |
                    set -euo pipefail
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Build.SourcesDirectory)/k8s/base/deployment.yaml"
                  displayName: "Apply Deployment"

                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" rollout status \
                      deployment/ksgaal-activity-map \
                      --timeout=300s
                  displayName: "Wait for rollout"

                # `rollout status` only proves the pods started, not that the
                # app answers. Ask the running container itself, from inside
                # the cluster — the one check that needs no hostname, no
                # certificate and no ingress controller. busybox wget ships in
                # the alpine base image.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" exec \
                      deploy/ksgaal-activity-map -- \
                      wget -q -O - --timeout=10 \
                      http://127.0.0.1:3000/api/health/ready
                    echo
                    echo "The application is serving inside the cluster."
                  displayName: "Smoke test from inside the cluster"

                # Two things we have never been able to verify from outside:
                # whether this cluster runs an nginx ingress controller at all,
                # and what address it would hand out. If ADDRESS below is empty,
                # the Ingress is inert and no hostname the academy gives us will
                # route until that is sorted. Reporting only — never fail the
                # deploy on it.
                - bash: |
                    echo "--- Ingress ---"
                    kubectl -n "$(k8sNamespace)" get ingress -o wide || true
                    echo
                    echo "--- Service ---"
                    kubectl -n "$(k8sNamespace)" get svc -o wide || true
                    echo
                    echo "Reachability today: the host in the Ingress is a"
                    echo "placeholder (dev.example.com) and the TLS secret"
                    echo "ksgaal-dev-tls does not exist. The app is running but"
                    echo "has no route in from a browser until the academy"
                    echo "supplies the real development hostname and certificate."
                  displayName: "Report how the app is exposed"
                  condition: always()

                # The node addresses come from our own pods' `status.hostIP`,
                # not from `kubectl get nodes` — Node is a cluster-scoped
                # resource this service account cannot read, but a Pod in `dev`
                # carries the address of the machine running it.
                - bash: |
                    set -euo pipefail
                    if [ "$(exposeNodePort)" != "true" ]; then
                      echo "exposeNodePort is off — skipping."
                      exit 0
                    fi

                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Build.SourcesDirectory)/k8s/overlays/dev/nodeport-service.yaml"

                    PORT=$(kubectl -n "$(k8sNamespace)" get svc \
                      ksgaal-activity-map-nodeport \
                      -o jsonpath='{.spec.ports[0].nodePort}')

                    IPS=$(kubectl -n "$(k8sNamespace)" get pods \
                      -l app=ksgaal-activity-map \
                      -o jsonpath='{range .items[*]}{.status.hostIP}{"\n"}{end}' \
                      | sort -u | grep -v '^$')

                    echo
                    echo "=================================================="
                    echo " Open the app from inside the academy's network:"
                    for ip in $IPS; do
                      echo "   http://$ip:$PORT"
                    done
                    echo
                    echo " Plain HTTP, temporary, internal only. Retire this"
                    echo " once the Ingress has a real hostname."
                    echo "=================================================="
                  displayName: "Expose on a node port and print the URL"
