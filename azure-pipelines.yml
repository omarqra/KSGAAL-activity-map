# ---------------------------------------------------------------------------
# Azure DevOps pipeline — ksgaal-activity-map
# Target: the academy's internal Azure DevOps Server (devops.ksaa.gov.sa),
#         collection Dev_Vendors, project Arabic-Around-theWorld.
#
# Everything below was verified by probe runs on 2026-09-09, not assumed:
#   • Agent pool `Default`, single self-hosted Linux agent KMO-ANSB-TOOL01.
#     There are NO Microsoft-hosted agents — `vmImage` cannot be used.
#   • Docker is installed, usable by the agent account, and can reach the
#     internet. Node is NOT installed — NodeTool below installs it.
#   • Service connection `development-AATW` is a Kubernetes connection using
#     token auth for service account `azdevops-dev` in namespace `dev`.
#     It has full rights inside `dev` and none at cluster scope, so this
#     pipeline never creates a Namespace.
#   • The academy's registry is Oracle Cloud's OCIR in Jeddah,
#     jed.ocir.io/axzbw7rafu2r — read off the images their other projects
#     have pulled onto this same agent.
#   • The agent holds no stored registry login, so this pipeline authenticates
#     itself rather than relying on ambient credentials.
#   • Only one environment exists: `development`.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  STILL NEEDED FROM THE ACADEMY: an OCIR username and auth token, set as │
# │  OCIR_USERNAME and OCIR_TOKEN (secret) in the `aatw-dev` variable group.│
# │  Nothing else — no service connection, and no pre-created pull secret:  │
# │  the pipeline logs in and provisions the pull secret in `dev` itself.   │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Variable group `aatw-dev` must be created in Library with:
#   non-secret:  APP_URL, NEXT_PUBLIC_FRONTEND_URL, NEXT_PUBLIC_BACKEND_URL,
#                NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
#   secret:      OCIR_USERNAME, OCIR_TOKEN,
#                DATABASE_URL, JWT_SECRET, SMTP_USER, SMTP_PASS,
#                ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME
#
# NEXT_PUBLIC_* are baked into the client bundle at image build time.
# ---------------------------------------------------------------------------

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: kubernetesServiceConnection
    value: "development-AATW"
  - name: k8sNamespace
    value: "dev"

  # Oracle Cloud Infrastructure Registry, Jeddah region.
  # Full image path: jed.ocir.io/axzbw7rafu2r/ksgaal-activity-map:<buildId>
  - name: registryHost
    value: "jed.ocir.io"
  - name: registryNamespace
    value: "axzbw7rafu2r"
  - name: imageRepository
    value: "ksgaal-activity-map"

  - name: dockerfilePath
    value: "Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"

  - group: aatw-dev

stages:
  # =========================================================================
  # Stage 1 — Validate. Runs on every PR and push. No cluster, no registry.
  # =========================================================================
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: Validate
        pool:
          name: Default
        steps:
          # The agent has no Node at all, so this task is mandatory rather
          # than a version pin. It downloads Node — safe, internet is open.
          - task: NodeTool@0
            displayName: "Install Node 20"
            inputs:
              versionSpec: "20.x"

          - task: Cache@2
            displayName: "Cache npm"
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: ~/.npm

          - script: npm ci
            displayName: "npm ci"

          - script: npx prisma generate
            displayName: "prisma generate"
            env:
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"

          - script: npm run lint
            displayName: "npm run lint"

          - script: npm run ts-check
            displayName: "npm run ts-check"

          - script: npm run build
            displayName: "npm run build (CI smoke, no real secrets)"
            env:
              NODE_ENV: production
              APP_ENV: prod
              DATABASE_URL: "postgresql://x:x@localhost:5432/x"
              JWT_SECRET: "ci-placeholder-not-used-at-runtime-32chars!"
              NEXT_PUBLIC_FRONTEND_URL: "https://example.com"
              NEXT_PUBLIC_BACKEND_URL: "https://example.com"

  # =========================================================================
  # Stage 2 — Build and push to OCIR. Main branch only.
  #
  # Plain docker commands rather than the Docker@2 task: that task requires a
  # Docker Registry service connection, and the project has none. Logging in
  # from credentials in the variable group needs nothing created on the
  # academy's side beyond the two values themselves.
  # =========================================================================
  - stage: BuildAndPush
    displayName: "Build and push image"
    dependsOn: Validate
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Docker
        pool:
          name: Default
        steps:
          # Fail with a readable message rather than an opaque docker error
          # while the academy has not yet supplied credentials.
          - bash: |
              set -euo pipefail
              if [ -z "${OCIR_USERNAME:-}" ] || [ -z "${OCIR_TOKEN:-}" ]; then
                echo "##[error] OCIR credentials are missing."
                echo "##[error] Set OCIR_USERNAME and OCIR_TOKEN (secret) in the"
                echo "##[error] aatw-dev variable group under Pipelines > Library."
                exit 1
              fi
            displayName: "Check OCIR credentials are set"
            env:
              OCIR_USERNAME: $(OCIR_USERNAME)
              OCIR_TOKEN: $(OCIR_TOKEN)

          # --password-stdin keeps the token out of the process list.
          - bash: |
              set -euo pipefail
              printf '%s' "$OCIR_TOKEN" \
                | docker login "$(registryHost)" -u "$OCIR_USERNAME" --password-stdin
            displayName: "Log in to OCIR"
            env:
              OCIR_USERNAME: $(OCIR_USERNAME)
              OCIR_TOKEN: $(OCIR_TOKEN)

          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker build \
                -f "$(dockerfilePath)" \
                -t "$IMAGE:$(tag)" \
                -t "$IMAGE:latest" \
                --build-arg NEXT_PUBLIC_FRONTEND_URL="$(NEXT_PUBLIC_FRONTEND_URL)" \
                --build-arg NEXT_PUBLIC_BACKEND_URL="$(NEXT_PUBLIC_BACKEND_URL)" \
                --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(NEXT_PUBLIC_GOOGLE_MAPS_API_KEY)" \
                "$(Build.SourcesDirectory)"
            displayName: "Build image"

          - bash: |
              set -euo pipefail
              IMAGE="$(registryHost)/$(registryNamespace)/$(imageRepository)"
              docker push "$IMAGE:$(tag)"
              docker push "$IMAGE:latest"
            displayName: "Push image"

          # The agent is shared with the academy's other projects — do not
          # leave our credentials in its Docker config.
          - bash: docker logout "$(registryHost)"
            displayName: "Log out of OCIR"
            condition: always()

          - publish: $(Build.SourcesDirectory)/k8s
            artifact: k8s-manifests
            displayName: "Publish k8s manifests"

  # =========================================================================
  # Stage 3 — Deploy to the `development` environment (namespace `dev`).
  # =========================================================================
  - stage: DeployDevelopment
    displayName: "Deploy — development"
    dependsOn: BuildAndPush
    condition: |
      and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevelopment
        environment: development
        pool:
          name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: k8s-manifests

                - task: Kubernetes@1
                  displayName: "Authenticate kubectl"
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceEndpoint: $(kubernetesServiceConnection)
                    namespace: $(k8sNamespace)
                    command: login

                - bash: |
                    set -euo pipefail
                    BASE="$(Pipeline.Workspace)/k8s-manifests/base"
                    sed -i \
                      -e "s#REGISTRY_HOST#$(registryHost)/$(registryNamespace)#g" \
                      -e "s#IMAGE_TAG#$(tag)#g" \
                      "$BASE/deployment.yaml" \
                      "$BASE/migration-job.yaml"
                  displayName: "Substitute image placeholders"

                # OCIR repositories are private, so the cluster needs its own
                # credentials to pull. We hold create rights on secrets in
                # `dev`, so the pipeline provisions this itself.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" create secret docker-registry \
                      ocir-pull-secret \
                      --docker-server="$(registryHost)" \
                      --docker-username="$OCIR_USERNAME" \
                      --docker-password="$OCIR_TOKEN" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: "Create/update image pull secret"
                  env:
                    OCIR_USERNAME: $(OCIR_USERNAME)
                    OCIR_TOKEN: $(OCIR_TOKEN)

                # ConfigMap, Service, Ingress. The overlay contains no
                # Namespace resource — the token cannot create one, and `dev`
                # already exists.
                - bash: |
                    set -euo pipefail
                    kubectl apply -k \
                      "$(Pipeline.Workspace)/k8s-manifests/overlays/dev/"
                  displayName: "Apply ConfigMap, Service, Ingress"

                # Secret values come from the aatw-dev group. They are passed
                # through the shell environment only — never written to a file
                # and never echoed; Azure DevOps masks secret variables in logs.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" create secret generic \
                      ksgaal-activity-map-secrets \
                      --from-literal=DATABASE_URL="$SECRET_DATABASE_URL" \
                      --from-literal=JWT_SECRET="$SECRET_JWT_SECRET" \
                      --from-literal=SMTP_USER="$SECRET_SMTP_USER" \
                      --from-literal=SMTP_PASS="$SECRET_SMTP_PASS" \
                      --from-literal=ADMIN_EMAIL="$SECRET_ADMIN_EMAIL" \
                      --from-literal=ADMIN_PASSWORD="$SECRET_ADMIN_PASSWORD" \
                      --from-literal=ADMIN_NAME="$SECRET_ADMIN_NAME" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  displayName: "Create/update Kubernetes Secret"
                  env:
                    SECRET_DATABASE_URL: $(DATABASE_URL)
                    SECRET_JWT_SECRET: $(JWT_SECRET)
                    SECRET_SMTP_USER: $(SMTP_USER)
                    SECRET_SMTP_PASS: $(SMTP_PASS)
                    SECRET_ADMIN_EMAIL: $(ADMIN_EMAIL)
                    SECRET_ADMIN_PASSWORD: $(ADMIN_PASSWORD)
                    SECRET_ADMIN_NAME: $(ADMIN_NAME)

                # A Job is immutable, so the previous one must go before the
                # new one can be applied.
                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" delete job \
                      ksgaal-activity-map-migrate \
                      --ignore-not-found=true
                  displayName: "Remove previous migration Job"

                - bash: |
                    set -euo pipefail
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Pipeline.Workspace)/k8s-manifests/base/migration-job.yaml"
                  displayName: "Apply migration Job"

                # Migrations must succeed before the Deployment is touched,
                # otherwise new pods would start against an old schema.
                - bash: |
                    set -euo pipefail
                    if ! kubectl -n "$(k8sNamespace)" wait \
                        --for=condition=complete \
                        --timeout=300s \
                        job/ksgaal-activity-map-migrate; then
                      echo "##[error] Migration Job failed or timed out. Logs:"
                      kubectl -n "$(k8sNamespace)" logs \
                        job/ksgaal-activity-map-migrate --tail=500 || true
                      exit 1
                    fi
                  displayName: "Wait for migration Job"

                - bash: |
                    set -euo pipefail
                    kubectl apply -n "$(k8sNamespace)" \
                      -f "$(Pipeline.Workspace)/k8s-manifests/base/deployment.yaml"
                  displayName: "Apply Deployment"

                - bash: |
                    set -euo pipefail
                    kubectl -n "$(k8sNamespace)" rollout status \
                      deployment/ksgaal-activity-map \
                      --timeout=300s
                  displayName: "Wait for rollout"
